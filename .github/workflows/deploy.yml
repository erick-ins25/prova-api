name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prova-ci:${{ github.sha }}

      - name: Deploy to AWS
        uses: appleboy/ssh-action@master
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          envs: DB_PASSWORD,DOCKERHUB_USERNAME,IMAGE_TAG

          script: |
            docker stop prova-api || true
            docker rm prova-api || true

            docker pull $DOCKERHUB_USERNAME/prova-ci:$IMAGE_TAG

            docker run -d \
              --name prova-api \
              --network prova-network \
              -p 8080:8080 \
              -e DB_HOST=prova-postgres \
              -e DB_PORT=5432 \
              -e DB_NAME=prova \
              -e DB_USER=postgres \
              -e DB_PASSWORD="$DB_PASSWORD" \
              $DOCKERHUB_USERNAME/prova-ci:$IMAGE_TAG